<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | PHEBIANA BILINGUAL INSTITUTE (PBT)</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-size='22' font-family='system-ui,sans-serif' font-weight='700' text-anchor='middle' fill='%23f59e0b'%3EPBT%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f0fdfa', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 800:'#115e59', 900:'#134e4a', 950:'#042f2e' },
            accent: { DEFAULT:'#f59e0b', dark:'#d97706' }
          }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col dark:bg-slate-900 transition-colors">
  <header class="bg-brand-950 text-white">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold text-sm">
        <span class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center text-brand-950 text-xs font-black">PBT</span>
        PHEBIANA BILINGUAL INSTITUTE
      </a>
      <button type="button" id="themeToggle" class="text-brand-200 hover:text-white p-1" aria-label="Theme">◐</button>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 p-8">
      <h1 class="text-2xl font-bold text-brand-900 dark:text-brand-100 mb-1">Create your account</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Join PBT and start your bilingual journey</p>

      <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm" role="alert"></div>
      <div id="configWarn" class="hidden mb-4 p-3 rounded-lg text-sm bg-amber-50 text-amber-900 border border-amber-200">
        Firebase is not configured yet. Replace the keys in this page’s script with your Firebase project settings.
      </div>

      <div class="grid grid-cols-1 gap-2 mb-5">
        <button type="button" id="btnGoogle" class="flex items-center justify-center gap-2 w-full border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl py-2.5 text-sm font-medium transition dark:text-slate-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <button type="button" id="btnApple" class="flex items-center justify-center gap-2 w-full border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl py-2.5 text-sm font-medium transition dark:text-slate-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Continue with Apple
        </button>
        <button type="button" id="btnGithub" class="flex items-center justify-center gap-2 w-full border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl py-2.5 text-sm font-medium transition dark:text-slate-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          Continue with GitHub
        </button>
      </div>

      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-600"></div></div>
        <div class="relative flex justify-center text-xs"><span class="bg-white dark:bg-slate-800 px-3 text-slate-400">or email</span></div>
      </div>

      <form id="regForm" class="space-y-4" novalidate>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="firstName" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">First name</label>
            <input type="text" id="firstName" required autocomplete="given-name"
              class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Last name</label>
            <input type="text" id="lastName" required autocomplete="family-name"
              class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
          <input type="email" id="email" required autocomplete="email"
            class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
            placeholder="you@example.com" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password"
            class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
            placeholder="Min. 6 characters" />
          <div id="passStrength" class="mt-1 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
            <div id="passBar" class="h-full w-0 transition-all bg-red-400"></div>
          </div>
          <p id="passHint" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <div>
          <label for="course" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Interested course (optional)</label>
          <select id="course" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="">Select later</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
            <option value="kids-teens">Kids &amp; Teens</option>
          </select>
        </div>
        <label class="flex items-start gap-2 text-xs text-slate-600 dark:text-slate-400">
          <input type="checkbox" id="terms" required class="mt-0.5 accent-brand-600" />
          <span>I agree to the <a href="legal.html" class="text-brand-700 underline" target="_blank">Terms &amp; Privacy</a>.</span>
        </label>
        <button type="submit" id="submitBtn"
          class="w-full bg-accent hover:bg-accent-dark text-brand-950 font-semibold py-2.5 rounded-xl transition disabled:opacity-60">
          Create account with Email
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
        Already have an account? <a href="login.html" class="text-brand-700 dark:text-brand-300 font-semibold hover:underline">Log in</a>
      </p>
    </div>
  </main>

  <script>
    const PBT_CONFIG = {
      firebase: {
        apiKey: "AIzaSyA75IlZR-dIvuVq-IHuesitY6g5JU6_r4c",
        authDomain: "project1-85c38.firebaseapp.com",
        projectId: "project1-85c38",
        storageBucket: "project1-85c38.firebasestorage.app",
        messagingSenderId: "104769342336",
        appId: "1:104769342336:web:984da1d8d579cf925acf65",
        measurementId: "G-QK27C2G0RW"
      },
      adminEmails: [
        "onyekamiracle08@gmail.com",
        "admin2@example.com",
        "admin3@example.com",
        "admin4@example.com"
      ]
    };

    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var c = params.get("course");
        if (c) {
          var sel = document.getElementById("course");
          if (sel) sel.value = c;
        }
      } catch (e) {}
    })();

    function showAlert(msg, type) {
      var el = document.getElementById("alert");
      el.className = "mb-4 p-3 rounded-lg text-sm " + (type === "error" ? "bg-red-50 text-red-700 border border-red-200 dark:bg-red-950 dark:text-red-200" : "bg-green-50 text-green-700 border border-green-200 dark:bg-green-950 dark:text-green-200");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function isConfigured() {
      var k = PBT_CONFIG.firebase.apiKey;
      return k && k.indexOf("REPLACE") !== 0;
    }

    function scorePassword(pw) {
      var s = 0;
      if (pw.length >= 6) s++;
      if (pw.length >= 10) s++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
      if (/\d/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return Math.min(s, 4);
    }

    function createUserProfile(user, extra) {
      var db = firebase.firestore();
      var data = {
        firstName: (extra && extra.firstName) || "",
        lastName: (extra && extra.lastName) || "",
        email: (user.email || "").toLowerCase(),
        role: "student",
        interestedCourse: (extra && extra.course) || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
        provider: user.providerData && user.providerData[0] ? user.providerData[0].providerId : "password"
      };
      if (!data.firstName && user.displayName) {
        var parts = user.displayName.split(" ");
        data.firstName = parts[0] || "";
        data.lastName = parts.slice(1).join(" ") || "";
      }
      return db.collection("users").doc(user.uid).set(data, { merge: true });
    }

    function afterRegister(user, extra) {
      return createUserProfile(user, extra).then(function () {
        try { user.sendEmailVerification(); } catch (e) {}
        showAlert("Account created. Check your email to verify, then continue.", "success");
        var course = (extra && extra.course) || new URLSearchParams(location.search).get("course");
        setTimeout(function () {
          location.href = course ? "dashboard.html?enroll=" + encodeURIComponent(course) : "dashboard.html";
        }, 900);
      });
    }

    function socialSignIn(provider) {
      if (!isConfigured()) {
        showAlert("Firebase is not configured. Add your project keys first.", "error");
        return;
      }
      firebase.auth().signInWithPopup(provider)
        .then(function (result) {
          return afterRegister(result.user, { course: document.getElementById("course").value || null });
        })
        .catch(function (err) {
          if (err.code === "auth/popup-closed-by-user") return;
          if (err.code === "auth/account-exists-with-different-credential") {
            showAlert("An account already exists with this email using a different sign-in method. Please log in with that method.", "error");
            return;
          }
          showAlert(err.message || "Sign-up failed", "error");
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
      try {
        if (localStorage.getItem("pbt_theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
      document.getElementById("themeToggle").addEventListener("click", function () {
        var dark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", dark);
        try { localStorage.setItem("pbt_theme", dark ? "dark" : "light"); } catch (e) {}
      });

      document.getElementById("password").addEventListener("input", function () {
        var s = scorePassword(this.value);
        var bar = document.getElementById("passBar");
        var hint = document.getElementById("passHint");
        var widths = ["0%", "25%", "50%", "75%", "100%"];
        var colors = ["bg-red-400", "bg-red-400", "bg-amber-400", "bg-lime-500", "bg-green-500"];
        var labels = ["", "Weak", "Fair", "Good", "Strong"];
        bar.style.width = widths[s];
        bar.className = "h-full transition-all " + colors[s];
        hint.textContent = labels[s];
      });

      if (!isConfigured()) {
        document.getElementById("configWarn").classList.remove("hidden");
        return;
      }
      if (!firebase.apps.length) firebase.initializeApp(PBT_CONFIG.firebase);
      var auth = firebase.auth();

      auth.onAuthStateChanged(function (user) {
        if (user) location.href = "dashboard.html";
      });

      document.getElementById("btnGoogle").addEventListener("click", function () {
        socialSignIn(new firebase.auth.GoogleAuthProvider());
      });
      document.getElementById("btnApple").addEventListener("click", function () {
        var p = new firebase.auth.OAuthProvider("apple.com");
        p.addScope("email");
        p.addScope("name");
        socialSignIn(p);
      });
      document.getElementById("btnGithub").addEventListener("click", function () {
        socialSignIn(new firebase.auth.GithubAuthProvider());
      });

      document.getElementById("regForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var firstName = document.getElementById("firstName").value.trim();
        var lastName = document.getElementById("lastName").value.trim();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var course = document.getElementById("course").value;
        var btn = document.getElementById("submitBtn");

        if (!document.getElementById("terms").checked) {
          showAlert("Please accept the Terms & Privacy.", "error");
          return;
        }
        if (!firstName || !lastName || !email || password.length < 6) {
          showAlert("Please fill all required fields (password min 6 characters).", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Creating…";

        auth.createUserWithEmailAndPassword(email, password)
          .then(function (cred) {
            return cred.user.updateProfile({ displayName: firstName + " " + lastName }).then(function () {
              return afterRegister(cred.user, { firstName: firstName, lastName: lastName, course: course || null });
            });
          })
          .catch(function (err) {
            var msg = err.message || "Registration failed";
            if (err.code === "auth/email-already-in-use") msg = "This email is already registered. Try logging in.";
            if (err.code === "auth/weak-password") msg = "Password is too weak.";
            showAlert(msg, "error");
            btn.disabled = false;
            btn.textContent = "Create account with Email";
          });
      });
    });
  </script>
</body>
</html>
